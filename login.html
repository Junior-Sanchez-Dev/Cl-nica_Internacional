<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Clínica Internacional/Login/Registro</title>
    <link rel="icon" href="img/logo la bendecida.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/login.css?v=20261118-2" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">Clínica Internacional</a>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#about">Servicios</a></li>
          <li><a href="index.html#team">Doctores</a></li>
          <li><a href="index.html#google-map">Contacto</a></li>
          <li><a href="#" class="login-button">Iniciar sesión</a></li>
        </ul>
      </nav>
    </header>

    <div class="container">
      <div class="form-container sign-in">
        <form id="login-form">
          <h2>Ingresa para reservar tu cita</h2>
          <div class="input-field">
            <input type="email" name="email" required />
            <label>Correo electrónico</label>
          </div>
          <div class="input-field">
            <input type="password" name="password" required />
            <label>Contraseña</label>
          </div>
          <div class="forget">
            <label for="remember">
              <input type="checkbox" id="remember" name="remember" />
              <p>Recuérdame</p>
            </label>
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit">Iniciar Sesión</button>
          <div class="register">
            <p>
              ¿No tienes una cuenta?
              <a href="#" class="register-link">Regístrate</a>
            </p>
          </div>
        </form>
      </div>

      <div class="form-container sign-up">
        <form id="signup-form">
          <h2>Registrarse</h2>
          <div class="input-field">
            <input type="text" name="nombre" required />
            <label>Nombre</label>
          </div>
          <div class="input-field">
            <input type="text" name="apellido" required />
            <label>Apellido</label>
          </div>
          <div class="input-field">
            <input type="email" name="email" required />
            <label>Correo electrónico</label>
          </div>
          <div class="input-field">
            <input type="password" id="password" name="password" required />
            <label>Contraseña</label>
          </div>
          <div class="input-field">
            <input type="password" id="confirm-password" required />
            <label>Confirmar contraseña</label>
          </div>
          <div
            id="password-error"
            class="error-message"
            style="display: none; color: red"
          >
            Las contraseñas no coinciden
          </div>
          <button type="submit">Registrarse</button>
          <div class="login">
            <p>
              ¿Ya tienes una cuenta?
              <a href="#" class="login-link">Inicia sesión</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <script src="js/esb-client.js?v=1"></script><script src="js/login.js?v=20261119-esb-json"></script>
  </body>
</html>
